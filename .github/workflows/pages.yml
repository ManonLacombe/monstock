name: Déployer la version web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publier web/ sur GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # Le dossier publié est exactement le dossier web/ du dépôt :
      # c'est la même base de code que celle embarquée dans l'APK Android.
      - name: Publier les artefacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4